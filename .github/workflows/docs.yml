on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: docs/rules.tex
      - run: |
          mkdir -p docs/build
          mv rules.pdf docs/build/rules.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: rules.pdf
          path: docs/build/rules.pdf
          retention-days: 30
      - uses: JamesIves/github-pages-deploy-action@v4
        if: github.ref == 'refs/heads/master'
        with:
            commit-message: ${{ github.event.head_commit.message }}
            single-commit: yes
            folder: docs/build
